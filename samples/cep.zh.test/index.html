<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CEP ZH Test</title>
  <style>
    body { font: 13px/1.5 "Segoe UI", sans-serif; background: #232323; color: #ddd; margin: 14px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    button { margin: 2px 6px 2px 0; padding: 4px 10px; }
    input { width: 220px; padding: 4px; }
    .card { border: 1px solid #444; padding: 8px; margin: 8px 0; }
    .hint { color: #9a9a9a; }
    code { color: #9cdcfe; }
    iframe { width: 100%; height: 46px; border: 1px solid #444; }
  </style>
</head>
<body>
  <h1>Localization Test Panel</h1>
  <p class="hint">Rendered by CEPHtmlEngine (Chromium 99), not by After Effects.</p>

  <div class="card">
    <button id="apply" title="Apply the current settings">Apply</button>
    <button id="cancel">Cancel</button>
    <button id="reset" title="Restore default values">Reset</button>
  </div>

  <div class="card">
    <input id="search" type="text" placeholder="Search presets..." aria-label="Search presets" />
    <p>Status: <span id="status">Ready</span></p>
    <p id="dynamic">Frames rendered: 0</p>
  </div>

  <div class="card" id="host">
    <p>Light DOM content</p>
  </div>

  <div class="card">
    <pre><code>const greeting = "Hello, world";</code></pre>
    <div contenteditable="true">Editable text stays English</div>
  </div>

  <iframe id="frame" src="frame.html" title="Preview frame"></iframe>

  <script>
    const shadowHost = document.getElementById('host');
    const root = shadowHost.attachShadow({ mode: 'open' });
    root.innerHTML = '<p>Shadow DOM content</p><button title="Shadow action">Shadow Apply</button>';

    const states = ['Ready', 'Rendering...', 'Building preview...', 'Done'];
    let i = 0, n = 0;
    setInterval(() => {
      document.getElementById('status').textContent = states[i++ % states.length];
      document.getElementById('dynamic').textContent = 'Frames rendered: ' + (++n);
    }, 900);
  </script>
</body>
</html>
