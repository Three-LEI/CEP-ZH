  <text x="122" y="382" fill="#8c867c" font-family="Consolas, monospace" font-size="11">Chromium / CEF · HTML + CSS + JS</text>

  <rect x="88" y="404" width="394" height="54" rx="7" fill="#2a2926" stroke="#3d3a34"/>
  <circle cx="108" cy="431" r="4" fill="#d27754"/>
