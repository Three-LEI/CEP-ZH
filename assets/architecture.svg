<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Microsoft YaHei UI','Microsoft YaHei','MiSans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d94f24"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b9b5aa"/>
    </marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.1" fill="#e6e1d6"/>
    </pattern>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d94f24"/>
      <stop offset="1" stop-color="#e9a07f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#fbfaf7"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- header -->
  <text x="60" y="64" fill="#d94f24" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" letter-spacing="2.4">CEP-ZH / HOW IT WORKS</text>
  <text x="60" y="116" fill="#1b1b19" font-size="40" font-weight="700" letter-spacing="0.4">CEP 通用汉化是怎么工作的</text>
  <text x="60" y="150" fill="#6f6e67" font-size="16">不修改扩展源码 · 本地 CDP 注入 · 字典驱动 · 页面实时热更新</text>
  <text x="1540" y="64" fill="#a9a69c" text-anchor="end" font-family="Consolas,monospace" font-size="12">v0.8.0</text>
  <line x1="60" y1="178" x2="1540" y2="178" stroke="#e2e0d8"/>

  <text x="60" y="207" fill="#9b9a91" font-family="Consolas,monospace" font-size="10.5" letter-spacing="1.6">汉化流程 / PIPELINE</text>
  <text x="1540" y="207" fill="#b0ada3" text-anchor="end" font-size="11.5">从左到右 5 步：点开插件，中文就位</text>

  <!-- step 1 -->
  <g>
    <rect x="60" y="222" width="256" height="196" rx="12" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="74" y="238" width="30" height="4" rx="2" fill="url(#accentBar)"/>
    <circle cx="90" cy="270" r="15" fill="#fdeee8"/>
    <text x="90" y="275.5" text-anchor="middle" fill="#d94f24" font-size="15" font-weight="700">1</text>
    <text x="116" y="276" fill="#1b1b19" font-size="17" font-weight="600">打开插件面板</text>
    <text x="82" y="316" fill="#5f5e57" font-size="12.5">CEP 面板本质是 Chromium 页面，</text>
    <text x="82" y="338" fill="#5f5e57" font-size="12.5">HTML + CSS + JS 绘制整个界面。</text>
    <text x="82" y="373" fill="#9b9a91" font-family="Consolas,monospace" font-size="10.5">Adobe 宿主内 · AE / PS / PR / AI</text>
  </g>

  <!-- arrow 1->2 -->
  <line x1="318" y1="320" x2="362" y2="320" stroke="#d94f24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="306" text-anchor="middle" fill="#c0603a" font-size="10.5">启动</text>

  <!-- step 2 -->
  <g>
    <rect x="366" y="222" width="256" height="196" rx="12" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="380" y="238" width="30" height="4" rx="2" fill="url(#accentBar)"/>
    <circle cx="396" cy="270" r="15" fill="#fdeee8"/>
    <text x="396" y="275.5" text-anchor="middle" fill="#d94f24" font-size="15" font-weight="700">2</text>
    <text x="422" y="276" fill="#1b1b19" font-size="17" font-weight="600">Agent 自动发现</text>
    <text x="388" y="316" fill="#5f5e57" font-size="12.5">隐藏面板拉起独立 Node 进程，</text>
    <text x="388" y="338" fill="#5f5e57" font-size="12.5">读取 .debug 找到面板调试端口。</text>
    <text x="388" y="373" fill="#9b9a91" font-family="Consolas,monospace" font-size="10.5">无需手动配置 · 随开随接</text>
  </g>

  <!-- arrow 2->3 -->
  <line x1="624" y1="320" x2="668" y2="320" stroke="#d94f24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="646" y="306" text-anchor="middle" fill="#c0603a" font-size="10.5">.debug</text>

  <!-- step 3 -->
  <g>
    <rect x="672" y="222" width="256" height="196" rx="12" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="686" y="238" width="30" height="4" rx="2" fill="url(#accentBar)"/>
    <circle cx="702" cy="270" r="15" fill="#fdeee8"/>
    <text x="702" y="275.5" text-anchor="middle" fill="#d94f24" font-size="15" font-weight="700">3</text>
    <text x="728" y="276" fill="#1b1b19" font-size="17" font-weight="600">CDP 注入运行时</text>
    <text x="694" y="316" fill="#5f5e57" font-size="12.5">本机 WebSocket 连上该页面，</text>
    <text x="694" y="338" fill="#5f5e57" font-size="12.5">把 runtime.js 注入进去。</text>
    <text x="694" y="373" fill="#9b9a91" font-family="Consolas,monospace" font-size="10.5">127.0.0.1 · 只走回环，不出网</text>
  </g>

  <!-- arrow 3->4 -->
  <line x1="930" y1="320" x2="974" y2="320" stroke="#d94f24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="952" y="306" text-anchor="middle" fill="#c0603a" font-size="10.5">字典</text>

  <!-- step 4 -->
  <g>
    <rect x="978" y="222" width="256" height="196" rx="12" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="992" y="238" width="30" height="4" rx="2" fill="url(#accentBar)"/>
    <circle cx="1008" cy="270" r="15" fill="#fdeee8"/>
    <text x="1008" y="275.5" text-anchor="middle" fill="#d94f24" font-size="15" font-weight="700">4</text>
    <text x="1034" y="276" fill="#1b1b19" font-size="17" font-weight="600">按字典替换文案</text>
    <text x="1000" y="316" fill="#5f5e57" font-size="12.5">扫描文本与 title / placeholder /</text>
    <text x="1000" y="338" fill="#5f5e57" font-size="12.5">aria-* 等属性，命中即换成中文。</text>
    <text x="1000" y="373" fill="#9b9a91" font-family="Consolas,monospace" font-size="10.5">只改页面 DOM，不改扩展文件</text>
  </g>

  <!-- arrow 4->5 -->
  <line x1="1236" y1="320" x2="1280" y2="320" stroke="#d94f24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1258" y="306" text-anchor="middle" fill="#c0603a" font-size="10.5">生效</text>

  <!-- step 5 -->
  <g>
    <rect x="1284" y="222" width="256" height="196" rx="12" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="1298" y="238" width="30" height="4" rx="2" fill="url(#accentBar)"/>
    <circle cx="1314" cy="270" r="15" fill="#fdeee8"/>
    <text x="1314" y="275.5" text-anchor="middle" fill="#d94f24" font-size="15" font-weight="700">5</text>
    <text x="1340" y="276" fill="#1b1b19" font-size="17" font-weight="600">界面变成中文</text>
    <text x="1306" y="316" fill="#5f5e57" font-size="12.5">MutationObserver 盯住 DOM 重绘，</text>
    <text x="1306" y="338" fill="#5f5e57" font-size="12.5">切页面、弹窗、iframe 继续翻译。</text>
    <text x="1306" y="373" fill="#9b9a91" font-family="Consolas,monospace" font-size="10.5">随时一键恢复英文原文</text>
  </g>

  <!-- connectors from support cards -->
  <path d="M 340 452 V 438 H 494 V 420" fill="none" stroke="#b8b2a4" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrowSoft)"/>
  <text x="502" y="434" fill="#a9a69c" font-size="10.5">control.json</text>
  <line x1="1106" y1="452" x2="1106" y2="420" stroke="#b8b2a4" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrowSoft)"/>
  <text x="1114" y="440" fill="#a9a69c" font-size="10.5">读取字典</text>

  <!-- manager card -->
  <g>
    <rect x="60" y="452" width="560" height="250" rx="12" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="82" y="470" width="26" height="4" rx="2" fill="#d94f24" opacity="0.75"/>
    <text x="82" y="504" fill="#1b1b19" font-size="18" font-weight="600">管理器 · 本地控制面</text>
    <text x="82" y="530" fill="#9b9a91" font-family="Consolas,monospace" font-size="11">Modeless 窗口 · 写开关与任务</text>
    <circle cx="88" cy="560" r="3" fill="#d94f24"/>
    <text x="100" y="565" fill="#5f5e57" font-size="13">编辑词条，按全局 / 单插件开关汉化</text>
    <circle cx="88" cy="590" r="3" fill="#d94f24"/>
    <text x="100" y="595" fill="#5f5e57" font-size="13">自动捕获新词、自动翻译、词典整理</text>
    <circle cx="88" cy="620" r="3" fill="#d94f24"/>
    <text x="100" y="625" fill="#5f5e57" font-size="13">导入导出字典，查看 Agent 状态与日志</text>
    <text x="82" y="668" fill="#9b9a91" font-size="11.5">写入 control.json，Agent 监听后立即生效；全程本机文件，不经网络。</text>
  </g>

  <!-- dictionary card -->
  <g>
    <rect x="640" y="452" width="900" height="250" rx="12" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="662" y="470" width="26" height="4" rx="2" fill="#d94f24" opacity="0.75"/>
    <text x="662" y="504" fill="#1b1b19" font-size="18" font-weight="600">分层字典与翻译补充</text>
    <text x="662" y="530" fill="#9b9a91" font-family="Consolas,monospace" font-size="11">按优先级合并 · 空值自动回退</text>

    <rect x="662" y="546" width="320" height="42" rx="6" fill="#f7f4ee" stroke="#e6e2d8"/>
    <text x="676" y="564" fill="#3f3e38" font-size="12.5" font-weight="600">用户覆盖</text>
    <text x="676" y="580" fill="#a9a69c" font-family="Consolas,monospace" font-size="10">plugin override · 最高优先</text>
    <rect x="662" y="596" width="320" height="42" rx="6" fill="#f7f4ee" stroke="#e6e2d8"/>
    <text x="676" y="614" fill="#3f3e38" font-size="12.5" font-weight="600">插件字典</text>
    <text x="676" y="630" fill="#a9a69c" font-family="Consolas,monospace" font-size="10">per-extension · 捕获 / 翻译写入这里</text>
    <rect x="662" y="646" width="320" height="42" rx="6" fill="#f7f4ee" stroke="#e6e2d8"/>
    <text x="676" y="664" fill="#3f3e38" font-size="12.5" font-weight="600">公共字典</text>
    <text x="676" y="680" fill="#a9a69c" font-family="Consolas,monospace" font-size="10">global fallback · 空值回退</text>
    <line x1="700" y1="590" x2="700" y2="594" stroke="#c9c5ba" stroke-width="1.2" marker-end="url(#arrowSoft)"/>
    <line x1="700" y1="640" x2="700" y2="644" stroke="#c9c5ba" stroke-width="1.2" marker-end="url(#arrowSoft)"/>

    <line x1="1010" y1="542" x2="1010" y2="696" stroke="#eee9df"/>

    <text x="1038" y="556" fill="#9b9a91" font-size="11.5">词条从哪来（AI 翻译可选）</text>
    <rect x="1038" y="570" width="108" height="32" rx="6" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="1092" y="590" text-anchor="middle" fill="#5f5e57" font-size="11">捕获新词</text>
    <line x1="1152" y1="586" x2="1170" y2="586" stroke="#c9c5ba" stroke-width="1.3" marker-end="url(#arrowSoft)"/>
    <rect x="1176" y="570" width="108" height="32" rx="6" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="1230" y="590" text-anchor="middle" fill="#5f5e57" font-size="11">AI 翻译</text>
    <line x1="1290" y1="586" x2="1308" y2="586" stroke="#c9c5ba" stroke-width="1.3" marker-end="url(#arrowSoft)"/>
    <rect x="1314" y="570" width="108" height="32" rx="6" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="1368" y="590" text-anchor="middle" fill="#5f5e57" font-size="11">写回字典</text>
    <line x1="1428" y1="586" x2="1446" y2="586" stroke="#c9c5ba" stroke-width="1.3" marker-end="url(#arrowSoft)"/>
    <rect x="1452" y="570" width="78" height="32" rx="6" fill="#fdeee8" stroke="#f3d4c6"/>
    <text x="1485" y="590" text-anchor="middle" fill="#c0603a" font-size="11">热更新</text>

    <text x="1038" y="628" fill="#8a887f" font-size="11.5">翻译接口只接受“缺译文的词”，已有译文不会重复请求；</text>
    <text x="1038" y="650" fill="#8a887f" font-size="11.5">接口原样返回的词会被记住，可在管理器里一键整理掉。</text>
    <text x="1038" y="680" fill="#a9a69c" font-family="Consolas,monospace" font-size="10.5">可选翻译源：Edge / Google / Yandex / OpenAI / DeepL</text>
  </g>

  <!-- bottom guarantees -->
  <text x="60" y="726" fill="#5f5e57" font-size="13.5"><tspan fill="#d94f24" font-weight="600">一句话总结</tspan>：不碰扩展源码，只在本机把面板 DOM 换成中文；词条来自分层字典，空值回退，随时可恢复英文。</text>
  <g font-size="12">
    <rect x="60" y="748" width="128" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="124" y="768" text-anchor="middle" fill="#5f5e57">不修改扩展源码</text>
    <rect x="200" y="748" width="112" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="256" y="768" text-anchor="middle" fill="#5f5e57">只改页面 DOM</text>
    <rect x="324" y="748" width="150" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="399" y="768" text-anchor="middle" fill="#5f5e57">仅本机 127.0.0.1</text>
    <rect x="486" y="748" width="138" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="555" y="768" text-anchor="middle" fill="#5f5e57">字典空值自动回退</text>
    <rect x="636" y="748" width="124" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="698" y="768" text-anchor="middle" fill="#5f5e57">一键恢复英文</text>
  </g>
  <text x="1540" y="768" text-anchor="end" fill="#9b9a91" font-size="11.5">装一次，之后开机自动运行</text>

  <line x1="60" y1="838" x2="1540" y2="838" stroke="#e9e5db"/>
  <text x="60" y="866" fill="#a9a69c" font-family="Consolas,monospace" font-size="10.5" letter-spacing="1.2">LOCAL ONLY · NO SOURCE PATCH · RUNTIME INJECTION · DICTIONARY FALLBACK</text>
  <text x="1540" y="866" text-anchor="end" fill="#a9a69c" font-size="11">Three-LEI / CEP-ZH</text>
</svg>
