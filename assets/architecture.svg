<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" font-family="'Microsoft YaHei UI','Microsoft YaHei','MiSans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d94f24"/>
    </marker>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.1" fill="#e6e1d6"/>
    </pattern>
  </defs>

  <rect width="1000" height="1580" fill="#fbfaf7"/>
  <rect width="1000" height="1580" fill="url(#dots)"/>

  <!-- header -->
  <text x="56" y="64" fill="#d94f24" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" letter-spacing="2.4">CEP-ZH / HOW IT WORKS</text>
  <text x="56" y="116" fill="#1b1b19" font-size="40" font-weight="700" letter-spacing="0.4">CEP 通用汉化是怎么工作的</text>
  <text x="56" y="150" fill="#6f6e67" font-size="15">不修改扩展源码 · 本地 CDP 注入 · 字典驱动 · 页面实时热更新</text>
  <text x="944" y="64" fill="#a9a69c" text-anchor="end" font-family="Consolas,monospace" font-size="12">v0.9.0</text>
  <line x1="56" y1="178" x2="944" y2="178" stroke="#e2e0d8"/>

  <text x="56" y="210" fill="#9b9a91" font-family="Consolas,monospace" font-size="10.5" letter-spacing="1.6">汉化流程 / PIPELINE</text>
  <text x="944" y="210" fill="#b0ada3" text-anchor="end" font-size="11.5">五步：从打开面板到中文界面</text>

  <!-- step 1 -->
  <g>
    <rect x="56" y="228" width="888" height="126" rx="14" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="56" y="250" width="4" height="82" rx="2" fill="#d94f24"/>
    <circle cx="94" cy="291" r="23" fill="#fdeee8"/>
    <text x="94" y="298" text-anchor="middle" fill="#d94f24" font-size="21" font-weight="700">1</text>
    <text x="132" y="274" fill="#1b1b19" font-size="21" font-weight="600">打开插件面板</text>
    <text x="132" y="306" fill="#5f5e57" font-size="14">CEP 面板本质是运行在 Adobe 宿主里的 Chromium 页面，</text>
    <text x="132" y="330" fill="#5f5e57" font-size="14">界面由 HTML + CSS + JS 绘制，因此可以被本地调试。</text>
    <text x="920" y="330" text-anchor="end" fill="#9b9a91" font-family="Consolas,monospace" font-size="11">面板可被本地调试</text>
  </g>

  <!-- arrow 1->2 -->
  <line x1="500" y1="356" x2="500" y2="390" stroke="#d94f24" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="518" y="380" fill="#c0603a" font-size="11">启动</text>

  <!-- step 2 -->
  <g>
    <rect x="56" y="394" width="888" height="126" rx="14" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="56" y="416" width="4" height="82" rx="2" fill="#d94f24"/>
    <circle cx="94" cy="457" r="23" fill="#fdeee8"/>
    <text x="94" y="464" text-anchor="middle" fill="#d94f24" font-size="21" font-weight="700">2</text>
    <text x="132" y="440" fill="#1b1b19" font-size="21" font-weight="600">Agent 自动发现面板</text>
    <text x="132" y="472" fill="#5f5e57" font-size="14">隐藏的 Agent 面板拉起独立 Node 进程，读取各扩展的 .debug，</text>
    <text x="132" y="496" fill="#5f5e57" font-size="14">拿到面板的本地调试端口——不需要手动配置。</text>
    <text x="920" y="496" text-anchor="end" fill="#9b9a91" font-family="Consolas,monospace" font-size="11">拿到调试端口</text>
  </g>

  <!-- arrow 2->3 -->
  <line x1="500" y1="522" x2="500" y2="556" stroke="#d94f24" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="518" y="546" fill="#c0603a" font-size="11">读取调试端口</text>

  <!-- step 3 -->
  <g>
    <rect x="56" y="560" width="888" height="126" rx="14" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="56" y="582" width="4" height="82" rx="2" fill="#d94f24"/>
    <circle cx="94" cy="623" r="23" fill="#fdeee8"/>
    <text x="94" y="630" text-anchor="middle" fill="#d94f24" font-size="21" font-weight="700">3</text>
    <text x="132" y="606" fill="#1b1b19" font-size="21" font-weight="600">CDP 注入运行时</text>
    <text x="132" y="638" fill="#5f5e57" font-size="14">通过本机 WebSocket 连上该页面，把 runtime.js 注入进去，</text>
    <text x="132" y="662" fill="#5f5e57" font-size="14">全程只走 127.0.0.1 回环，不访问外网、不改扩展文件。</text>
    <text x="920" y="662" text-anchor="end" fill="#9b9a91" font-family="Consolas,monospace" font-size="11">runtime 已注入</text>
  </g>

  <!-- arrow 3->4 -->
  <line x1="500" y1="688" x2="500" y2="722" stroke="#d94f24" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="518" y="712" fill="#c0603a" font-size="11">注入 runtime.js</text>

  <!-- step 4 -->
  <g>
    <rect x="56" y="726" width="888" height="126" rx="14" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="56" y="748" width="4" height="82" rx="2" fill="#d94f24"/>
    <circle cx="94" cy="789" r="23" fill="#fdeee8"/>
    <text x="94" y="796" text-anchor="middle" fill="#d94f24" font-size="21" font-weight="700">4</text>
    <text x="132" y="772" fill="#1b1b19" font-size="21" font-weight="600">按字典替换文案</text>
    <text x="132" y="804" fill="#5f5e57" font-size="14">扫描文本节点和 title / placeholder / aria-* 等 UI 属性，</text>
    <text x="132" y="828" fill="#5f5e57" font-size="14">命中字典就换成中文；没有译文的词回退到公共字典。</text>
    <text x="920" y="828" text-anchor="end" fill="#9b9a91" font-family="Consolas,monospace" font-size="11">DOM 已是中文</text>
  </g>

  <!-- arrow 4->5 -->
  <line x1="500" y1="854" x2="500" y2="888" stroke="#d94f24" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="518" y="878" fill="#c0603a" font-size="11">替换页面文字</text>

  <!-- step 5 -->
  <g>
    <rect x="56" y="892" width="888" height="126" rx="14" fill="#ffffff" stroke="#e2e0d8"/>
    <rect x="56" y="914" width="4" height="82" rx="2" fill="#d94f24"/>
    <circle cx="94" cy="955" r="23" fill="#fdeee8"/>
    <text x="94" y="962" text-anchor="middle" fill="#d94f24" font-size="21" font-weight="700">5</text>
    <text x="132" y="938" fill="#1b1b19" font-size="21" font-weight="600">界面变成中文</text>
    <text x="132" y="970" fill="#5f5e57" font-size="14">MutationObserver 盯住 DOM 重绘，切页面、弹窗、iframe 继续翻译；</text>
    <text x="132" y="994" fill="#5f5e57" font-size="14">关掉开关或清空译文，立即恢复英文原文。</text>
    <text x="920" y="994" text-anchor="end" fill="#9b9a91" font-family="Consolas,monospace" font-size="11">实时保持中文</text>
  </g>

  <!-- support: dictionary -->
  <g>
    <rect x="56" y="1060" width="888" height="188" rx="14" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="80" y="1096" fill="#1b1b19" font-size="18" font-weight="600">分层字典 · 空值自动回退</text>
    <text x="80" y="1120" fill="#9b9a91" font-family="Consolas,monospace" font-size="11">用户覆盖 &gt; 插件字典 &gt; 公共字典</text>

    <rect x="80" y="1136" width="272" height="48" rx="8" fill="#f7f4ee" stroke="#e6e2d8"/>
    <text x="96" y="1157" fill="#3f3e38" font-size="13.5" font-weight="600">用户覆盖</text>
    <text x="96" y="1174" fill="#a9a69c" font-family="Consolas,monospace" font-size="9.5">plugin override · 最高优先</text>
    <text x="364" y="1167" text-anchor="middle" fill="#b8b2a4" font-size="18">&gt;</text>
    <rect x="372" y="1136" width="272" height="48" rx="8" fill="#f7f4ee" stroke="#e6e2d8"/>
    <text x="388" y="1157" fill="#3f3e38" font-size="13.5" font-weight="600">插件字典</text>
    <text x="388" y="1174" fill="#a9a69c" font-family="Consolas,monospace" font-size="9.5">per-extension · 捕获 / 翻译写入这里</text>
    <text x="656" y="1167" text-anchor="middle" fill="#b8b2a4" font-size="18">&gt;</text>
    <rect x="664" y="1136" width="256" height="48" rx="8" fill="#f7f4ee" stroke="#e6e2d8"/>
    <text x="680" y="1157" fill="#3f3e38" font-size="13.5" font-weight="600">公共字典</text>
    <text x="680" y="1174" fill="#a9a69c" font-family="Consolas,monospace" font-size="9.5">global fallback · 空值回退</text>

    <text x="80" y="1216" fill="#8a887f" font-size="11.5">自动捕获或 AI 翻译补充词条；插件字典缺译文时回退公共字典；接口原样返回的词可在管理器里整理。</text>
    <text x="80" y="1236" fill="#a9a69c" font-family="Consolas,monospace" font-size="10.5">可选翻译源：Edge / Google / Yandex / OpenAI / DeepL</text>
  </g>

  <!-- support: manager + safety -->
  <g>
    <rect x="56" y="1268" width="888" height="168" rx="14" fill="#ffffff" stroke="#e2e0d8"/>
    <line x1="500" y1="1296" x2="500" y2="1412" stroke="#eee9df"/>

    <text x="80" y="1304" fill="#1b1b19" font-size="18" font-weight="600">管理器 · 本地控制面</text>
    <circle cx="84" cy="1330" r="3" fill="#d94f24"/>
    <text x="96" y="1335" fill="#5f5e57" font-size="12.5">编辑词条，按全局 / 单插件开关汉化</text>
    <circle cx="84" cy="1356" r="3" fill="#d94f24"/>
    <text x="96" y="1361" fill="#5f5e57" font-size="12.5">自动捕获、自动翻译、词典整理</text>
    <circle cx="84" cy="1382" r="3" fill="#d94f24"/>
    <text x="96" y="1387" fill="#5f5e57" font-size="12.5">写入 control.json，Agent 监听后立即生效</text>

    <text x="524" y="1304" fill="#1b1b19" font-size="18" font-weight="600">安全边界</text>
    <circle cx="528" cy="1330" r="3" fill="#2f7d5d"/>
    <text x="540" y="1335" fill="#5f5e57" font-size="12.5">不修改扩展源码，只改页面 DOM</text>
    <circle cx="528" cy="1356" r="3" fill="#2f7d5d"/>
    <text x="540" y="1361" fill="#5f5e57" font-size="12.5">只在本机 127.0.0.1 回环通信</text>
    <circle cx="528" cy="1382" r="3" fill="#2f7d5d"/>
    <text x="540" y="1387" fill="#5f5e57" font-size="12.5">随时恢复英文原文，可随时卸载</text>
  </g>

  <!-- bottom badges -->
  <g font-size="12">
    <rect x="56" y="1470" width="128" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="120" y="1490" text-anchor="middle" fill="#5f5e57">不修改扩展源码</text>
    <rect x="194" y="1470" width="108" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="248" y="1490" text-anchor="middle" fill="#5f5e57">只改页面 DOM</text>
    <rect x="312" y="1470" width="146" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="385" y="1490" text-anchor="middle" fill="#5f5e57">仅本机 127.0.0.1</text>
    <rect x="468" y="1470" width="136" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="536" y="1490" text-anchor="middle" fill="#5f5e57">字典空值自动回退</text>
    <rect x="614" y="1470" width="120" height="30" rx="15" fill="#ffffff" stroke="#e2e0d8"/>
    <text x="674" y="1490" text-anchor="middle" fill="#5f5e57">可恢复英文原文</text>
  </g>
  <text x="944" y="1490" text-anchor="end" fill="#9b9a91" font-size="11.5">安装后随 Adobe 启动自动运行</text>

  <line x1="56" y1="1526" x2="944" y2="1526" stroke="#e9e5db"/>
  <text x="56" y="1552" fill="#a9a69c" font-family="Consolas,monospace" font-size="10" letter-spacing="1">LOCAL ONLY · NO SOURCE PATCH · RUNTIME INJECTION · DICTIONARY FALLBACK</text>
  <text x="944" y="1552" text-anchor="end" fill="#a9a69c" font-size="11">Three-LEI / CEP-ZH</text>
</svg>
